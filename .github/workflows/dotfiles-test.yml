name: Dotfiles Test

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 5"

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        python-version:
          - "3.11"
          - "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install zsh on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh

      - name: Install chezmoi
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run dotfiles tests
        run: /bin/zsh tests/run.sh
        env:
          DOTFILES_TEST_PYTHON: python

  quality:
    name: Python quality and wheel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned quality tools
        run: >-
          python -m pip install
          ruff==0.16.5
          mypy==2.3.1
          build==1.3.0

      - name: Run Ruff
        run: |
          ruff check \
            scripts/agent-team/agent_team \
            scripts/agent-team/tests \
            tests/test_agent_team.py \
            tests/test_agent_team_mcp.py
          ruff format --check \
            scripts/agent-team/agent_team \
            scripts/agent-team/tests \
            tests/test_agent_team.py \
            tests/test_agent_team_mcp.py

      - name: Run strict mypy
        run: mypy --strict --python-version 3.11 scripts/agent-team/agent_team

      - name: Build agent-team wheel
        run: python -m build --wheel scripts/agent-team
