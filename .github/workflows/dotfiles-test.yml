name: Dotfiles Test

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 5"

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - macos-15-intel
        python-version:
          - "3.11"
          - "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shell runtimes on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bash zsh fish csh tcsh diffutils

      - name: Select genuine csh on Ubuntu
        if: runner.os == 'Linux'
        run: |
          package_files="$RUNNER_TEMP/csh-package-files"
          dpkg-query -L csh > "$package_files"
          bsd_csh_path=""
          while IFS= read -r package_path; do
            case "$package_path" in
              */bsd-csh)
                if test -z "$bsd_csh_path" && test -f "$package_path" && test -x "$package_path"; then
                  bsd_csh_path="$package_path"
                fi
                ;;
            esac
          done < "$package_files"
          test -n "$bsd_csh_path"
          test -f "$bsd_csh_path" && test -x "$bsd_csh_path"
          tcsh_path="$(command -v tcsh)"
          test -n "$tcsh_path" && test -x "$tcsh_path"
          csh_realpath="$(realpath "$bsd_csh_path")"
          tcsh_realpath="$(realpath "$tcsh_path")"
          test "$csh_realpath" != "$tcsh_realpath"
          csh_bin_dir="$RUNNER_TEMP/dotfiles-csh-bin"
          mkdir -p "$csh_bin_dir"
          ln -sf "$bsd_csh_path" "$csh_bin_dir/csh"
          echo "$csh_bin_dir" >> "$GITHUB_PATH"
          echo "DOTFILES_TEST_CSH_BIN=$bsd_csh_path" >> "$GITHUB_ENV"

      - name: Install Bash 5 and Fish on macOS
        if: runner.os == 'macOS'
        run: |
          brew install bash fish
          bash5_path="$(brew --prefix bash)/bin/bash"
          test -x "$bash5_path"
          "$bash5_path" -c '(( BASH_VERSINFO[0] == 5 ))'
          echo "BASH5_BIN=$bash5_path" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install uv==0.12.10

      - name: Sync locked agent-team environment
        run: uv sync --locked --project scripts/agent-team --python "${{ matrix.python-version }}"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install chezmoi
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run Bash shell-only bootstrap tests
        env:
          DOTFILES_TEST_REQUIRE_FISH: "1"
          DOTFILES_TEST_REQUIRE_CSH: "1"
          DOTFILES_TEST_REQUIRE_TCSH: "1"
        run: /bin/bash tests/test_setup_shell.sh

      - name: Run dotfiles tests
        run: uv run --locked --project scripts/agent-team /bin/zsh tests/run.sh
        env:
          DOTFILES_TEST_PYTHON: python

  shell-only-linux:
    name: Shell-only on ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian-bookworm
            image: debian:bookworm-slim
            require_csh: "1"
          - name: fedora-44
            image: fedora:44
            require_csh: "0"
    container:
      image: ${{ matrix.image }}

    steps:
      - name: Install shell runtimes
        shell: bash
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends bash fish csh tcsh curl ca-certificates git diffutils
          else
            dnf install -y bash fish tcsh curl ca-certificates git diffutils
          fi

      - name: Select genuine csh on Debian
        if: matrix.require_csh == '1'
        shell: bash
        run: |
          package_files=/tmp/csh-package-files
          dpkg-query -L csh > "$package_files"
          bsd_csh_path=""
          while IFS= read -r package_path; do
            case "$package_path" in
              */bsd-csh)
                if test -z "$bsd_csh_path" && test -f "$package_path" && test -x "$package_path"; then
                  bsd_csh_path="$package_path"
                fi
                ;;
            esac
          done < "$package_files"
          test -n "$bsd_csh_path"
          test -f "$bsd_csh_path" && test -x "$bsd_csh_path"
          tcsh_path="$(command -v tcsh)"
          test -n "$tcsh_path" && test -x "$tcsh_path"
          csh_realpath="$(realpath "$bsd_csh_path")"
          tcsh_realpath="$(realpath "$tcsh_path")"
          test "$csh_realpath" != "$tcsh_realpath"
          echo "DOTFILES_TEST_CSH_BIN=$bsd_csh_path" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install chezmoi in the container
        shell: bash
        run: |
          mkdir -p /tmp/chezmoi-bin
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /tmp/chezmoi-bin

      - name: Run Bash shell-only bootstrap test
        shell: bash
        env:
          PATH: /tmp/chezmoi-bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          DOTFILES_TEST_REQUIRE_FISH: "1"
          DOTFILES_TEST_REQUIRE_CSH: ${{ matrix.require_csh }}
          DOTFILES_TEST_REQUIRE_TCSH: "1"
        run: bash tests/test_setup_shell.sh

  quality:
    name: Python quality and wheel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv==0.12.10

      - name: Sync locked agent-team environment
        run: uv sync --locked --project scripts/agent-team --python "3.13"

      - name: Run Ruff
        run: |
          uv run --locked --project scripts/agent-team ruff check \
            scripts/agent-team/agent_team \
            scripts/agent-team/tests \
            tests/test_agent_team.py \
            tests/test_agent_team_mcp.py
          uv run --locked --project scripts/agent-team ruff format --check \
            scripts/agent-team/agent_team \
            scripts/agent-team/tests \
            tests/test_agent_team.py \
            tests/test_agent_team_mcp.py

      - name: Run strict mypy
        run: uv run --locked --project scripts/agent-team mypy --strict --python-version 3.11 scripts/agent-team/agent_team

      - name: Build agent-team distributions
        run: uv run --locked --project scripts/agent-team python -m build --no-isolation scripts/agent-team
