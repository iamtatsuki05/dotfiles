name: Dotfiles Test

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 5"

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install zsh on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh

      - name: Install Bash 5 on macOS
        if: runner.os == 'macOS'
        run: |
          brew install bash
          bash5_path="$(brew --prefix bash)/bin/bash"
          test -x "$bash5_path"
          "$bash5_path" -c '(( BASH_VERSINFO[0] == 5 ))'
          echo "BASH5_BIN=$bash5_path" >> "$GITHUB_ENV"

      - name: Install chezmoi
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run dotfiles tests
        run: /bin/zsh tests/run.sh
