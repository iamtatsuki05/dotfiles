developer_instructions = """
文書系スキルの選択では、ユーザーが指定した形式・保存先・既存成果物を優先する。
- ローカルWordは documents:documents、PDFは pdf:pdf、Excelは spreadsheets:Spreadsheets、一般プレゼンは presentations:Presentations を主担当にする。
- Google Docsの新規作成・既存編集・ネイティブテンプレートのコピーは google-drive:google-docs のネイティブ経路を優先する。documents側の新規Google Docs向けDOCX生成・import必須規則は適用しない。DOCXからのimportはユーザーが変換を依頼した場合に google-drive:google-docs で行う。
- 既存Google Sheetsの直接編集は google-drive:google-sheets、既存Google Slidesの編集・テンプレート踏襲は google-drive:google-slides を使う。
- プレゼンの保存先が未指定ならローカルPPTXを既定とし、PresentationsのSpaces既定規則より優先する。既存成果物の編集では元の形式・保存先を維持する。SpacesやGoogle Slidesが指定された場合はその指定に従う。
- consulting-pptx-skill は明示指定、経営会議向け資料の指定、または同形式の既存資料への追記に限る。一般的なプレゼン依頼では自動適用しない。上記条件で consulting を使う場合、編集可能な図表が必要なら consulting の構成・様式規則を使い、PPTX作成は Presentations の編集可能な要素を使う。両要件を満たせない場合は画像化せず、制約を示して確認する。
- Codexで無効化したローカル版・同期版の文書スキルを通常の候補へ戻さない。低レベルOOXML編集が必要で、ユーザーが同期版pptxの利用を明示指定した場合のみ、保存済み本文・補助ツールを必要な範囲で参照する。同一内容のコピーはパスの辞書順で1つを選び、内容が異なる場合は必要な機能を比較して選択理由を明示する。他のagent向けの元ファイルは保持する。
"""

model = "gpt-5.6-sol"
model_context_window = 1000000
model_auto_compact_token_limit = 900000
sandbox_mode = "danger-full-access"
ignore_patterns = [
  "**/.env",
  "**/.env.*",
  "**/secrets.env",
  "**/credentials.json",
  "**/secrets.json",
  "**/*.key",
  "**/*.pem",
  "**/id_rsa",
  "**/id_ed25519",
  "config/shell/secrets.env",
  ".tmp/",
  ".waza-cache/",
  ".waza-results/",
  ".venv/",
  "__pycache__/",
  "node_modules/",
  "result",
  "result-*",
  "dotfiles/.agent/changes/",
  "dotfiles/.agent/work/"
]
model_reasoning_effort = "medium"
hide_agent_reasoning = true
network_access = true
web_search = "live"
disable_response_storage = true
# for http header
rmcp_client = true
personality = "pragmatic"
service_tier = "default"

[agents]
max_concurrent_threads_per_session = 25
default_subagent_model = "gpt-6-astra"
default_subagent_reasoning_effort = "low"

[features]
# wait_agent の下限・既定値: 親が 10 秒待機を繰り返すと timeout ごとに親モデルが再実行され、育った context 全体が再入力されて利用枠を消耗するため 120 秒に揃える
multi_agent_v2.min_wait_timeout_ms = 120000
multi_agent_v2.default_wait_timeout_ms = 120000
context_management.experimental_mode = true
fast_mode = true
external_migration = true
hooks = true
undo = true
goals = true
memories = true
chronicle = true
js_repl = false

[mcp_servers.deepwiki]
url = "https://mcp.deepwiki.com/mcp"
startup_timeout_sec = 60

[mcp_servers.devin]
url = "https://mcp.devin.ai/mcp"
bearer_token_env_var = "DEVIN_API_KEY"
startup_timeout_sec = 60

[mcp_servers.figma]
url = "https://mcp.figma.com/mcp"
startup_timeout_sec = 60

[plugins."gmail@openai-curated"]
enabled = true

[plugins."github@openai-curated"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."sites@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."chrome@openai-bundled"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."computer-history@openai-bundled"]
enabled = true

[memories]
extract_model = "gpt-6-luna"
consolidation_model = "gpt-6.1-terra"
generate_memories = true
use_memories = true
disable_on_external_context = true

[desktop]
ambient-suggestions-enabled = false
preventSleepWhileRunning = true
keepRemoteControlAwakeWhilePluggedIn = true
selected-avatar-id = "custom:mirai"
conversationDetailMode = "STEPS_COMMANDS"
show-context-window-usage = true
followUpQueueMode = "queue"

[marketplaces.tokeneconomizer]
source_type = "git"
source = "https://github.com/microsoft/TokenEconomizer.git"
ref = "e428fc91b0f8ffecb5a596d56b14fe2f1485a5f9"

[plugins."tokeneconomizer@tokeneconomizer"]
enabled = true
