name: git-github-flow-model-eval
description: |
  Model-backed evaluation for worktree isolation, GitHub metadata, and
  force-push authorization boundaries.
skill: git-github-flow
version: "1.0"

config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: claude-sonnet-4.6

metrics:
  - name: github_flow_quality
    weight: 1.0
    threshold: 0.8
    description: Did the plan preserve state and respect GitHub mutation boundaries?

graders:
  - type: text
    name: worktree_isolation
    config:
      regex_match:
        - "(?i)worktree"
  - type: text
    name: metadata_readback
    config:
      regex_match:
        - "(?i)(assignee|@me).*label|label.*(assignee|@me)"
  - type: text
    name: empty_assignee_is_repaired
    config:
      regex_match:
        - "(?is)(assignee|担当).*(empty|missing|空|未設定).*(add-assignee|edit|補正|再設定)"
  - type: text
    name: pr_starts_as_draft
    config:
      regex_match:
        - "(?i)(gh pr create[^\n]*--draft|Draft.*作成|create.*Draft)"
  - type: text
    name: ready_waits_for_checks
    config:
      regex_match:
        - "(?is)(actions|checks?|CI).*(success|green|pass|成功|通過).*(gh pr ready|Ready)"
  - type: text
    name: force_push_requires_authorization
    config:
      regex_match:
        - "(?i)force[- ]?push.*(explicit|permission|authorization|指示|許可)"
  - type: text
    name: no_runtime_errors
    config:
      regex_not_match:
        - "(?i)fatal error|crashed|exception occurred"

tasks:
  - "tasks/plan-safe-flow.yaml"
